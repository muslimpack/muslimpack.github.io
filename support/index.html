<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | Muslim Pack</title>
    <style>
        :root {
            --bg-color: #201a18;
            --card-bg: #2c2421;
            --primary-text: #ffffff;
            --secondary-text: #d1cbc8;
            --accent-color: #ffb4a2;
            --border-color: #403430;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--primary-text);
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            max-width: 480px;
            width: 90%;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        h1 { 
            font-size: 1.8em;
            font-weight: 700;
            margin: 0 0 10px 0;
        }

        .slogan {
            color: var(--accent-color);
            font-size: 0.95em;
            font-weight: 500;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .contact-grid {
            text-align: left;
            display: grid;
            gap: 12px;
            margin-bottom: 35px;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .label {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--secondary-text);
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .value {
            font-size: 1.05em;
            font-weight: 500;
        }

        a {
            color: var(--primary-text);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--accent-color);
        }

        .footer {
            font-size: 0.85em;
            color: var(--secondary-text);
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
        }

        .footer p { margin: 5px 0; }

        .sbom-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.8em;
            color: var(--secondary-text);
            text-decoration: underline;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="/assets/images/logo.png" alt="Muslim Pack Logo" class="logo">
    
    <h1>Muslim Pack Support</h1>
    <p class="slogan">Open source, free, and ad-free apps for Muslims.</p>

    <div class="contact-grid">
        <div class="contact-item">
            <span class="label">Contact Email</span>
            <span class="value"><a href="mailto:muslimpack.org@gmail.com">muslimpack.org@gmail.com</a></span>
        </div>
        
        <div class="contact-item">
            <span class="label">Phone Support</span>
            <span class="value"><a href="tel:+201009973592">+20 100 997 3592</a></span>
        </div>

        <div class="contact-item">
            <span class="label">Legal Address</span>
            <span class="value">Mansoura, Egypt</span>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 Muslim Pack</p>
        <p style="font-size: 0.8em;">For general feedback and feature enhancement requests.</p>
        <a href="https://github.com/muslimpack" class="sbom-link">GitHub Organization</a>
    </div>
</div>

</body>
</html>
