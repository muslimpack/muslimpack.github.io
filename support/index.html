<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | Muslim Pack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0f0a08;
            --card-bg: #1a1412;
            --card-hover: #221b18;
            --primary-text: #ffffff;
            --secondary-text: #b8b0ad;
            --accent-color: #ff8c73;
            --accent-glow: rgba(255, 140, 115, 0.15);
            --border-color: #352d2a;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--primary-text);
            background: linear-gradient(135deg, #0f0a08 0%, #1a1210 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 140, 115, 0.08) 0%, transparent 50%);
            animation: pulse 15s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        .container {
            background: var(--card-bg);
            max-width: 500px;
            width: 100%;
            padding: 48px 40px;
            border-radius: 32px;
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.05);
            text-align: center;
            border: 1px solid var(--border-color);
            position: relative;
            backdrop-filter: blur(20px);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 24px;
        }

        .logo {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            object-fit: contain;
            background: linear-gradient(135deg, rgba(255, 140, 115, 0.1), rgba(255, 180, 162, 0.05));
            padding: 12px;
            box-shadow: var(--shadow-sm), 0 0 0 1px var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-sm), 0 0 24px var(--accent-glow);
        }

        h1 { 
            font-size: 2em;
            font-weight: 700;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--primary-text) 0%, var(--secondary-text) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .slogan {
            color: var(--accent-color);
            font-size: 1em;
            font-weight: 500;
            margin-bottom: 36px;
            line-height: 1.5;
            opacity: 0.95;
        }

        .contact-grid {
            text-align: left;
            display: grid;
            gap: 14px;
            margin-bottom: 40px;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 18px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .contact-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-glow) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .contact-item:hover {
            background: var(--card-hover);
            border-color: rgba(255, 140, 115, 0.3);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .contact-item:hover::before {
            opacity: 1;
        }

        .contact-item > * {
            position: relative;
            z-index: 1;
        }

        .label {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--secondary-text);
            margin-bottom: 6px;
            opacity: 0.7;
            font-weight: 600;
        }

        .value {
            font-size: 1.05em;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            opacity: 0.6;
        }

        a {
            color: var(--primary-text);
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        a:hover {
            color: var(--accent-color);
        }

        .footer {
            font-size: 0.85em;
            color: var(--secondary-text);
            border-top: 1px solid var(--border-color);
            padding-top: 28px;
            margin-top: 8px;
        }

        .footer p { 
            margin: 6px 0;
            opacity: 0.8;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            padding: 10px 20px;
            font-size: 0.85em;
            color: var(--primary-text);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .github-link:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 140, 115, 0.3);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        @media (max-width: 480px) {
            .container {
                padding: 36px 28px;
                border-radius: 24px;
            }

            h1 {
                font-size: 1.6em;
            }

            .logo-wrapper {
                width: 80px;
                height: 80px;
            }

            .logo {
                width: 80px;
                height: 80px;
                border-radius: 20px;
            }

            .contact-item {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-wrapper">
        <img src="/assets/images/logo.png" alt="Muslim Pack Logo" class="logo">
    </div>
    
    <h1>Muslim Pack Support</h1>
    <p class="slogan">Open source, free, and ad-free apps for Muslims.</p>

    <div class="contact-grid">
        <div class="contact-item">
            <span class="label">Contact Email</span>
            <span class="value">
                <span class="icon">✉</span>
                <a href="mailto:muslimpack.org@gmail.com">muslimpack.org@gmail.com</a>
            </span>
        </div>
        
        <div class="contact-item">
            <span class="label">Phone Support</span>
            <span class="value">
                <span class="icon">📞</span>
                <a href="tel:+201009973592">+20 100 997 3592</a>
            </span>
        </div>

        <div class="contact-item">
            <span class="label">Legal Address</span>
            <span class="value">
                <span class="icon">📍</span>
                <span>Mansoura, Egypt</span>
            </span>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 Muslim Pack</p>
        <p style="font-size: 0.85em; opacity: 0.7;">For general feedback and feature enhancement requests.</p>
        <a href="https://github.com/muslimpack" class="github-link">
            <span>⚙</span>
            <span>GitHub Organization</span>
        </a>
    </div>
</div>

</body>
</html>
