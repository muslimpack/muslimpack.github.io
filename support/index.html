<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Official Support | Muslimpack Open Source Initiative</title>
    <meta
      name="description"
      content="Official support center for Muslimpack. Connect with our developers, submit feedback, or request new features for our suite of open-source Islamic applications."
    />
    <meta
      name="keywords"
      content="Muslimpack, Support, Help, Open Source, Islam, Community, Contact"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="canonical" href="https://muslimpack.github.io/support/" />

    <!-- Open Graph Meta Tags -->
    <meta
      property="og:title"
      content="Muslimpack Support | We're here to help"
    />
    <meta
      property="og:description"
      content="Dedicated support and community feedback for Muslimpack's open-source apps."
    />
    <meta
      property="og:image"
      content="https://muslimpack.github.io/assets/images/logo.png"
    />
    <meta property="og:url" content="https://muslimpack.github.io/support/" />
    <meta property="og:type" content="website" />

    <!-- Favicon and Apple Touch Icon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/images/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/images/apple-icon-180x180.png"
    />
  </head>
  <body>
    <main class="container">
      <header class="logo-wrapper">
        <img
          src="/assets/images/logo.png"
          alt="Muslimpack Logo"
          class="logo"
          width="120"
          height="120"
        />
      </header>

      <section>
        <h1>Muslimpack Support</h1>
        <p class="slogan">Open source, free, and ad-free apps for Muslims.</p>
      </section>

      <div class="contact-grid">
        <article class="contact-item">
          <span class="label">Contact Email</span>
          <span class="value">
            <span class="icon" aria-hidden="true">✉</span>
            <a
              href="mailto:muslimpack.org@gmail.com"
              aria-label="Email us at muslimpack.org@gmail.com"
              >muslimpack.org@gmail.com</a
            >
          </span>
        </article>

        <article class="contact-item">
          <span class="label">Phone Support</span>
          <span class="value">
            <span class="icon" aria-hidden="true">📞</span>
            <a href="tel:+201009973592" aria-label="Call us at +20 100 997 3592"
              >+20 100 997 3592</a
            >
          </span>
        </article>

        <article class="contact-item">
          <span class="label">Legal Address</span>
          <span class="value">
            <span class="icon" aria-hidden="true">📍</span>
            <span>Mansoura, Egypt</span>
          </span>
        </article>
      </div>

      <footer class="footer">
        <p>&copy; 2026 Muslimpack</p>
        <p style="font-size: 0.85em; opacity: 0.7">
          For general feedback and feature enhancement requests.
        </p>
        <a
          href="https://github.com/muslimpack"
          class="github-link"
          aria-label="Visit Muslimpack on GitHub"
        >
          <span>GitHub Organization</span>
        </a>
      </footer>
    </main>
  </body>
</html>
