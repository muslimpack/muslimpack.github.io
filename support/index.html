<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | Muslim Pack</title>
    <link rel="stylesheet" href="styles.css" />
    <meta property="og:image" content="/assets/images/logo.png" />
    <meta property="og:type" content="website" />

    <!-- Favicon and Apple Touch Icon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/images/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/images/apple-icon-180x180.png"
    />
</head>
<body>

<div class="container">
    <div class="logo-wrapper">
        <img src="/assets/images/logo.png" alt="Muslim Pack Logo" class="logo">
    </div>
    
    <h1>Muslim Pack Support</h1>
    <p class="slogan">Open source, free, and ad-free apps for Muslims.</p>

    <div class="contact-grid">
        <div class="contact-item">
            <span class="label">Contact Email</span>
            <span class="value">
                <span class="icon">✉</span>
                <a href="mailto:muslimpack.org@gmail.com">muslimpack.org@gmail.com</a>
            </span>
        </div>
        
        <div class="contact-item">
            <span class="label">Phone Support</span>
            <span class="value">
                <span class="icon">📞</span>
                <a href="tel:+201009973592">+20 100 997 3592</a>
            </span>
        </div>

        <div class="contact-item">
            <span class="label">Legal Address</span>
            <span class="value">
                <span class="icon">📍</span>
                <span>Mansoura, Egypt</span>
            </span>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 Muslim Pack</p>
        <p style="font-size: 0.85em; opacity: 0.7;">For general feedback and feature enhancement requests.</p>
        <a href="https://github.com/muslimpack" class="github-link">
            <span>GitHub Organization</span>
        </a>
    </div>
</div>

</body>
</html>
